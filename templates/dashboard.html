<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Personal Finance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form label { display: block; margin: 8px 0; }
    #charts { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Finance Dashboard</h1>

  <section id="transaction-form">
    <h2>Add Transaction</h2>
    <form id="txForm">
      <label>Account:
        <select id="accountSelect" name="account_id"></select>
      </label>

      <label>Category:
        <select id="categorySelect" name="category_id"></select>
      </label>

      <label>Amount:
        <input type="number" step="0.01" id="amount" name="amount" required />
      </label>

      <label>Date:
        <input type="date" id="date" name="date" required />
      </label>

      <label>Note:
        <input type="text" id="note" name="note" />
      </label>

      <button type="submit">Add Transaction</button>
    </form>
  </section>

  <section id="charts">
    <h2>Spending by Category (This Month)</h2>
    <canvas id="categoryPie" width="400" height="400"></canvas>
  </section>

<script>
const CATEGORIES_ENDPOINT = "/api/categories/";
const TRANSACTION_ENDPOINT = "/api/transactions/";
const REPORTS_ENDPOINT = "/api/reports/category_breakdown/";

function getCookie(name) {
  const cookieValue = document.cookie.split('; ').find(row => row.startsWith(name + '='));
  return cookieValue ? decodeURIComponent(cookieValue.split('=')[1]) : null;
}
const csrftoken = getCookie('csrftoken');

const categorySelect = document.getElementById('categorySelect');
const accountSelect = document.getElementById('accountSelect');
const txForm = document.getElementById('txForm');
const amountInput = document.getElementById('amount');
const dateInput = document.getElementById('date');
const noteInput = document.getElementById('note');
const ctx = document.getElementById('categoryPie').getContext('2d');
let pieChart = null;

async function fetchCategoriesAndAccounts() {
  try {
    const resp = await fetch(CATEGORIES_ENDPOINT, { credentials: 'include' });
    if (!resp.ok) throw new Error('Failed to fetch categories');
    const categories = await resp.json();
    categorySelect.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = `${cat.name} (${cat.type})`;
      categorySelect.append(opt);
    });
    // accounts
    const accResp = await fetch('/api/accounts/', { credentials: 'include' });
    if (accResp.ok) {
      const accounts = await accResp.json();
      accountSelect.innerHTML = '';
      accounts.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name;
        accountSelect.append(opt);
      });
    }
  } catch (err) {
    console.error(err);
  }
}

txForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    account_id: accountSelect.value,
    category_id: categorySelect.value,
    amount: amountInput.value,
    note: noteInput.value,
    date: dateInput.value
  };
  try {
    const resp = await fetch(TRANSACTION_ENDPOINT, {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken
      },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const err = await resp.json();
      console.error('Transaction failed', err);
      alert('Failed to submit transaction.');
      return;
    }
    txForm.reset();
    await loadAndRenderChart();
  } catch (err) {
    console.error(err);
    alert('Network error submitting transaction');
  }
});

async function loadAndRenderChart() {
  try {
    const resp = await fetch(REPORTS_ENDPOINT, { credentials: 'include' });
    if (!resp.ok) throw new Error('Failed to fetch report');
    const json = await resp.json();
    const labels = json.labels || [];
    const data = json.data || [];
    const colors = json.colors && json.colors.map(c => c || undefined);
    const dataset = {
      labels,
      datasets: [{
        label: 'Expenses - ' + json.month,
        data,
        backgroundColor: colors.length ? colors : undefined,
      }]
    };
    if (pieChart) {
      pieChart.data.labels = labels;
      pieChart.data.datasets[0].data = data;
      if (colors.length) pieChart.data.datasets[0].backgroundColor = colors;
      pieChart.update();
      return;
    }
    pieChart = new Chart(ctx, {
      type: 'pie',
      data: dataset,
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'right' },
          tooltip: {
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const val = context.formattedValue || '0';
                const total = data.reduce((a,b) => a + b, 0) || 1;
                const percent = ((context.raw / total) * 100).toFixed(1) + '%';
                return `${label}: ${val} (${percent})`;
              }
            }
          }
        }
      }
    });
  } catch (err) {
    console.error(err);
  }
}

(function init() {
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;
  fetchCategoriesAndAccounts();
  loadAndRenderChart();
})();
</script>
</body>
</html>
